<!DOCTYPE html>
<html>
<head>
  <title>Test</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .log { margin: 5px 0; padding: 8px; background: #f0f0f0; border-radius: 4px; }
    .ok { color: green; }
    .err { color: red; }
  </style>
</head>
<body>
  <h2>Module Loading Test</h2>
  <div id="logs"></div>

  <script>
    const logEl = document.getElementById('logs');
    const log = (msg, ok = true) => {
      const el = document.createElement('div');
      el.className = 'log ' + (ok ? 'ok' : 'err');
      el.textContent = msg;
      logEl.appendChild(el);
      console.log(msg);
    };

    window.addEventListener('error', (e) => {
      log('ERROR: ' + e.message, false);
    });

    log('Page loaded, importing modules...');
  </script>

  <script type="module">
    try {
      log('Starting module import...');
      await import('./assets/js/main.js?v=1.4.2');
      log('✓ Module loaded successfully');
    } catch (err) {
      log('✗ Module load failed: ' + err.message, false);
      log('Stack: ' + err.stack, false);
    }
  </script>
</body>
</html>
