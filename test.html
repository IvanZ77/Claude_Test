<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据验证测试套件</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      margin-bottom: 10px;
      color: #222;
    }
    .subtitle {
      color: #666;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .console {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 15px;
      border-radius: 6px;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 12px;
      max-height: 600px;
      overflow-y: auto;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .console-line {
      margin: 2px 0;
    }
    .log { color: #d4d4d4; }
    .pass { color: #4ec9b0; }
    .fail { color: #f48771; }
    .warn { color: #dcdcaa; }
    .info { color: #569cd6; }
    .section-header {
      font-weight: bold;
      color: #4da6ff;
      margin-top: 10px;
      margin-bottom: 5px;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .stat {
      padding: 15px;
      border-radius: 6px;
      text-align: center;
    }
    .stat-passed {
      background: #f0fdf4;
      border-left: 4px solid #22c55e;
    }
    .stat-failed {
      background: #fef2f2;
      border-left: 4px solid #ef4444;
    }
    .stat-warning {
      background: #fffbeb;
      border-left: 4px solid #f59e0b;
    }
    .stat-value {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .stat-label {
      font-size: 12px;
      color: #666;
    }
    .stat-passed .stat-value { color: #22c55e; }
    .stat-failed .stat-value { color: #ef4444; }
    .stat-warning .stat-value { color: #f59e0b; }
    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #2563eb;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 数据验证测试套件</h1>
    <p class="subtitle">检查所有数据文件的完整性和正确性</p>

    <div class="controls">
      <button id="runAllBtn" onclick="runAllTests()">运行全部测试</button>
      <button id="clearBtn" onclick="clearConsole()">清除日志</button>
      <button id="exportBtn" onclick="exportResults()">导出结果</button>
    </div>

    <div id="console" class="console"></div>

    <div id="summary" class="summary"></div>
  </div>

  <script type="module">
    import { loadAllData } from './assets/js/data-loader.js';
    import { validateAllData, validateMatchTierFunction } from './assets/js/test/data-validator.js';
    import { matchTier } from './assets/js/calc/tier.js';

    // Redirect console.log to our custom console
    const consoleEl = document.getElementById('console');
    const originalLog = console.log;
    const logs = [];

    function customLog(...args) {
      const message = args
        .map(arg => (typeof arg === 'string' ? arg : JSON.stringify(arg, null, 2)))
        .join(' ');

      logs.push(message);
      originalLog(...args);

      const lines = message.split('\n');
      lines.forEach(line => {
        if (line.trim()) {
          const logEl = document.createElement('div');
          logEl.className = 'console-line';

          // Color by content
          if (line.includes('✅')) {
            logEl.innerHTML = `<span class="pass">${escapeHtml(line)}</span>`;
          } else if (line.includes('❌')) {
            logEl.innerHTML = `<span class="fail">${escapeHtml(line)}</span>`;
          } else if (line.includes('⚠️')) {
            logEl.innerHTML = `<span class="warn">${escapeHtml(line)}</span>`;
          } else if (line.includes('📋') || line.includes('📊') || line.includes('🧪')) {
            logEl.innerHTML = `<span class="info">${escapeHtml(line)}</span>`;
          } else {
            logEl.textContent = line;
          }

          consoleEl.appendChild(logEl);
        }
      });

      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    console.log = customLog;

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    window.runAllTests = async function() {
      document.getElementById('runAllBtn').disabled = true;
      clearConsole();

      try {
        console.log('🚀 加载应用数据...\n');
        const data = await loadAllData();

        console.log('✅ 数据加载完成\n');

        // Run main validation
        const results = await validateAllData(data);

        // Run matchTier tests
        console.log('\n' + '='.repeat(60));
        const tierResults = validateMatchTierFunction(matchTier, data.cityData.shanghai.tiers, data.householdModels);

        // Show summary
        showSummary(results, tierResults);
      } catch (error) {
        console.log(`❌ 测试失败: ${error.message}`);
        console.error(error);
      } finally {
        document.getElementById('runAllBtn').disabled = false;
      }
    };

    window.clearConsole = function() {
      consoleEl.innerHTML = '';
      logs.length = 0;
    };

    window.exportResults = function() {
      const text = logs.join('\n');
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `测试结果-${new Date().toISOString().slice(0, 10)}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    };

    function showSummary(results, tierResults) {
      const summaryEl = document.getElementById('summary');
      summaryEl.innerHTML = `
        <div class="stat stat-passed">
          <div class="stat-value">${results.passed}</div>
          <div class="stat-label">✅ 通过</div>
        </div>
        <div class="stat stat-failed">
          <div class="stat-value">${results.failed}</div>
          <div class="stat-label">❌ 失败</div>
        </div>
        <div class="stat stat-warning">
          <div class="stat-value">${results.warnings}</div>
          <div class="stat-label">⚠️ 警告</div>
        </div>
        <div class="stat stat-passed">
          <div class="stat-value">${tierResults.passed}</div>
          <div class="stat-label">Tier匹配通过</div>
        </div>
      `;
    }

    // Show loading message
    console.log('📋 测试页面已就绪');
    console.log('点击"运行全部测试"按钮开始验证数据\n');
  </script>
</body>
</html>
